name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  v2:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check cnn_v2 tests/test_v2.py scripts/build_report.py
      - run: python -m pytest tests/test_v2.py -q
      - run: python scripts/build_report.py --check
  legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-legacy-dev.txt
      - run: python -m pytest tests/test_pipeline.py -q
        env:
          TF_CPP_MIN_LOG_LEVEL: '2'
          TF_NUM_INTRAOP_THREADS: '2'
          TF_NUM_INTEROP_THREADS: '2'
